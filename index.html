<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f6" id="themeColor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مساعد الاجتماعات">
<meta name="format-detection" content="telephone=no">
<link rel="icon" id="favicon">
<link rel="apple-touch-icon" id="touchIcon">
<title>مساعد الاجتماعات | Meeting Assistant</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
:root{--fs:16px;--bg:#eef1f6;--card:#fff;--card2:#f5f7fb;--tx:#14213d;--mu:#5b6578;--bd:#d8dee9;--hl:#fff4d6;--ok:#15803d;--bad:#b91c1c;--ac:#1d4ed8;--on:#fff;--acs:#e3eafc;--sh:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.05);color-scheme:light}
:root[data-theme=dark]{--bg:#0e1b2e;--card:#16273f;--card2:#12223a;--tx:#eaf0f8;--mu:#93a1b8;--bd:#25395a;--hl:#2b2a1d;--ok:#4ade80;--bad:#f87171;--sh:none;color-scheme:dark}
:root[data-theme=black]{--bg:#000;--card:#0e0e11;--card2:#08080a;--tx:#f2f2f4;--mu:#9a9aa3;--bd:#26262c;--hl:#1e1c10;--ok:#4ade80;--bad:#f87171;--sh:none;color-scheme:dark}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:1rem/1.6 "IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;min-height:100dvh;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
svg{width:1.25em;height:1.25em;flex:none}
h1{font-size:1.25rem;margin:0}
h2{font-size:1.05rem;margin:0 0 10px}
h3{margin:14px 0 6px;font-size:.92rem;color:var(--mu);font-weight:600}
a{color:var(--ac)}
.mt{margin-top:12px}.center{text-align:center}.mu{color:var(--mu)}.small{font-size:.85rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.row:last-child{margin-bottom:0}
.between{justify-content:space-between}
.grow{flex:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
select,input[type=text],input[type=password],input[type=email],input[type=search],textarea{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font:inherit;min-width:0;min-height:44px;width:100%}
.row>input[type=text],.row>input[type=search]{flex:1;width:auto}
.row>select{width:auto;flex:1}
textarea{min-height:140px;resize:vertical;display:block}
textarea.short{min-height:84px}textarea.tall{min-height:230px}
input[type=range]{flex:1;accent-color:var(--ac);min-height:32px}
input[type=checkbox],input[type=radio]{accent-color:var(--ac);width:20px;height:20px;margin:0;flex:none}
button,.btn{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 15px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
button:disabled{opacity:.55;cursor:default}
button.main{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
button.rec{background:var(--bad);border-color:var(--bad);color:#fff}
button.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--bd))}
button.link{border:0;background:none;color:var(--ac);padding:6px 2px;min-height:36px}
button.icon{padding:0;width:44px}
button.ghost{background:none;border-color:transparent}
button.wide{width:100%}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:.85rem;color:var(--mu);margin-bottom:5px;font-weight:600}
.chk{display:flex;gap:9px;align-items:center;margin-bottom:10px;cursor:pointer;min-height:32px}
.note{font-size:.84rem;color:var(--mu);margin-top:8px}
.err{color:var(--bad);font-size:.9rem;min-height:1.4em;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;padding:2px 10px;border-radius:99px;background:var(--acs);color:var(--ac);font-weight:600}
.pill:empty{display:none}

/* header + nav */
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 8px) 16px 6px}
.hin{max-width:860px;margin:auto;display:flex;align-items:center;gap:8px}
.hin h1{flex:1;display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--ac);color:var(--on);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
nav{display:flex;gap:4px;max-width:860px;margin:4px auto 0;padding:0 12px}
nav button{flex:1;flex-direction:column;gap:2px;background:none;border:0;color:var(--mu);font-size:.78rem;font-weight:600;padding:6px 2px;border-radius:12px;min-height:54px}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--ac);background:var(--acs)}
main{max-width:860px;margin:auto;padding:12px 16px 24px}
.pane{display:none}.pane.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.hin h1>span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hin h1{min-width:0}
.pill{white-space:nowrap}
@media (max-width:480px){
 .hin h1{font-size:1.02rem;gap:8px}
 .logo{width:32px;height:32px}
 .hin>button.icon{width:38px}
 .langbar{gap:6px}
 .langbar select{font-size:.88rem;padding-inline:8px;min-width:0}
 .langbar button.icon{width:40px}
}
@media (max-width:480px){#engPill{display:none}}
@media (max-width:819px){
 nav{position:fixed;bottom:0;inset-inline:0;max-width:none;margin:0;background:var(--card);border-top:1px solid var(--bd);padding:5px 4px calc(5px + env(safe-area-inset-bottom));z-index:6;gap:2px}
 nav button{font-size:.7rem}
 main{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
}

/* translate */
.langbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.langbar select{flex:1;width:auto}
.out{min-height:200px;border:1px solid var(--bd);background:var(--card);border-radius:16px;padding:4px 14px;box-shadow:var(--sh)}
.line{padding:10px 0;border-bottom:1px solid var(--bd);display:flex;gap:6px;align-items:flex-start}
.line:last-child{border:0}
.line .txt{flex:1;min-width:0}
.o{color:var(--mu);font-size:.88rem}
.a{font-size:1.28rem;font-weight:600;margin-top:2px}
.a.err{color:var(--mu);font-weight:400;font-size:.94rem}
.acts{display:flex;gap:2px}
.acts button{width:38px;min-height:38px;padding:0;border:0;background:none;color:var(--mu)}
.acts button.on{color:#d97706}
.live{color:var(--mu);font-size:.94rem;padding:8px 0;min-height:40px}
.empty{color:var(--mu);text-align:center;padding:34px 10px;font-size:.92rem}
.ph{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--bd)}
.ph:last-child{border:0}

/* conversation */
.chat .bub{max-width:88%;margin:10px 0;padding:10px 14px;border-radius:16px;background:var(--card2);border:1px solid var(--bd)}
.chat .bub.me{margin-inline-start:auto;background:var(--acs);border-color:transparent}
.chat .bub .who{font-size:.75rem;color:var(--mu);font-weight:600}
.mics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.mic{flex-direction:column;min-height:96px;border-radius:22px;font-weight:600;font-size:1rem;border-width:2px}
.mic svg{width:30px;height:30px}
.mic small{font-weight:400;font-size:.8rem;color:var(--mu)}
.mic.me{border-color:var(--ac);color:var(--ac)}
.mic.on{background:var(--ac);color:var(--on);animation:pulse 1.4s infinite}
.mic.on small{color:inherit;opacity:.85}
.mic.wait{opacity:.7}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 55%,transparent)}70%{box-shadow:0 0 0 16px transparent}100%{box-shadow:0 0 0 0 transparent}}
.flipbox{transform:rotate(180deg);background:var(--ac);color:var(--on);border-radius:18px;padding:18px;font-size:1.6rem;font-weight:600;min-height:110px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;text-align:center}

/* meetings */
.time{font-variant-numeric:tabular-nums;color:var(--mu);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad);display:inline-block;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.sum{background:var(--hl);border-radius:14px;padding:12px 14px;margin-top:12px}
.sum h3{margin-top:0}
.sum div{white-space:pre-wrap}
.saved{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.saved:last-child{border:0}
.saved span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved small{display:block;color:var(--mu)}

/* coach */
.target{font-size:1.5rem;line-height:2;padding:10px 14px;background:var(--card);border:1px solid var(--bd);border-radius:16px;direction:ltr;text-align:left}
.w{display:inline-block;margin-inline-end:8px;cursor:pointer;border-bottom:3px solid transparent}
.w.ok{border-color:var(--ok)}.w.bad{border-color:var(--bad);color:var(--bad)}
.w small{display:block;font-size:.75rem;line-height:1.2;color:var(--mu)}
.stats{display:flex;gap:12px;margin:12px 0}
.stat{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 14px}
.stat b{font-size:1.6rem;display:block}

/* emails */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{padding:7px 12px;font-size:.88rem;min-height:38px;border-radius:99px;text-align:start}
.chip.sug{border-color:var(--ac);color:var(--ac)}
.badge{display:inline-block;background:var(--ac);color:var(--on);border-radius:99px;padding:2px 12px;font-size:.82rem;font-weight:600;margin-bottom:6px}
.pv{padding:7px 0;border-bottom:1px solid var(--bd)}.pv:last-child{border:0}
.pv b{display:block;font-size:.84rem;color:var(--mu);font-weight:600}

/* settings */
.seg{display:flex;background:var(--card2);border:1px solid var(--bd);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:10px;min-height:40px;padding:6px 8px;font-size:.92rem}
.seg button.on{background:var(--card);color:var(--ac);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw{width:40px;height:40px;min-height:40px;border-radius:50%;padding:0;border:3px solid var(--card)}
.sw.on{outline:3px solid var(--tx);outline-offset:1px}
.swatches input[type=color]{width:44px;height:44px;border:1px solid var(--bd);border-radius:50%;padding:2px;background:var(--card);cursor:pointer}
.vg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.vcard{flex-direction:column;padding:14px 8px;border-radius:16px;border-width:2px;min-height:110px}
.vcard svg{width:30px;height:30px}
.vcard small{color:var(--mu);font-size:.78rem}
.vcard.on{border-color:var(--ac);background:var(--acs);color:var(--ac)}
details summary{cursor:pointer;font-weight:600;padding:8px 0;color:var(--ac)}
.diag div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);font-size:.9rem}
.diag div:last-child{border:0}

/* auth */
#auth{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;display:none;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 20px)}
body.locked #auth{display:block}
body.locked #app{display:none}
.authbox{max-width:420px;margin:0 auto}
.authtop{display:flex;justify-content:flex-end;gap:6px;margin-bottom:6px}
.biglogo{width:72px;height:72px;border-radius:22px;background:var(--ac);color:var(--on);display:grid;place-items:center;margin:8px auto 12px;box-shadow:0 10px 30px color-mix(in srgb,var(--ac) 35%,transparent)}
.biglogo svg{width:40px;height:40px}
.pw{position:relative}
.pw input{padding-inline-end:48px}
[dir=rtl] .pw input[dir=ltr]{padding-left:48px;padding-right:12px}
.pw button{position:absolute;inset-inline-end:2px;top:2px;border:0;background:none;color:var(--mu);width:42px;min-height:40px;padding:0}
.meter{height:6px;border-radius:9px;background:var(--bd);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;width:0;transition:width .2s,background .2s}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;direction:ltr;text-align:left;word-break:break-all;min-height:90px}
.users{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.radios{display:flex;gap:16px;flex-wrap:wrap}
.radios label{display:flex;gap:6px;align-items:center;cursor:pointer}

/* email reset */
.mailwait{display:flex;gap:12px;align-items:flex-start;background:var(--acs);border-radius:14px;padding:12px 14px}
.mailwait p{margin:4px 0 0}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid color-mix(in srgb,var(--ac) 25%,transparent);border-top-color:var(--ac);animation:spin 1s linear infinite;flex:none;margin-top:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.okline{color:var(--ok);font-weight:600}

/* tasks */
nav button{position:relative}
.nb{position:absolute;top:3px;inset-inline-end:calc(50% - 24px);background:var(--bad);color:#fff;font-size:.65rem;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;line-height:1}
.banner{background:color-mix(in srgb,var(--bad) 10%,var(--card));border:1px solid color-mix(in srgb,var(--bad) 35%,var(--bd));border-radius:16px;padding:12px 14px;margin-bottom:14px;white-space:pre-wrap}
.banner b{display:block;margin-bottom:4px}
.task{border:1px solid var(--bd);border-inline-start:6px solid var(--sc);border-radius:14px;margin:10px 0;background:var(--card)}
.task.closed{opacity:.72}
.thead{display:flex;gap:10px;align-items:flex-start;padding:12px;width:100%;background:none;border:0;text-align:start;justify-content:flex-start;border-radius:14px}
.thead .tt{flex:1;min-width:0}
.thead b{display:block;font-size:1rem;word-break:break-word}
.spill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--sc) 16%,transparent);color:var(--sc);white-space:nowrap}
.due{font-size:.8rem;color:var(--mu);display:block;margin-top:3px}
.due.over{color:var(--bad);font-weight:700}
.tbody{padding:2px 12px 12px;border-top:1px solid var(--bd)}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}
.sbtn{border-color:var(--sc);color:var(--sc);font-size:.8rem;padding:4px;min-height:42px;font-weight:600}
.sbtn.on{background:var(--sc);color:#fff}
.cnt{border-color:var(--sc);color:var(--sc);font-weight:600}
.cnt.on{background:var(--sc);color:#fff}
:root:not([data-theme=light]) .spill,:root:not([data-theme=light]) .sbtn:not(.on),:root:not([data-theme=light]) .cnt:not(.on){color:color-mix(in srgb,var(--sc) 55%,#fff)}
.hist{list-style:none;padding:0;margin:6px 0 10px;font-size:.85rem}
.hist li{padding:4px 0;display:flex;gap:8px;align-items:baseline}
.hist li i{width:9px;height:9px;border-radius:50%;background:var(--sc);flex:none;display:inline-block}
.hist li span{color:var(--mu);white-space:nowrap}
input[type=date]{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;font:inherit;min-height:44px;width:100%}

#hCmd{color:var(--ac);background:var(--acs)}#hCmd.rec{background:var(--bad);color:#fff;animation:pulse 1.4s infinite}
#toast{position:fixed;inset-inline:16px;bottom:calc(84px + env(safe-area-inset-bottom));background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:12px;display:none;max-width:560px;margin:auto;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (min-width:820px){#toast{bottom:24px}}

/* AI assistant */
input[type=url]{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font:inherit;min-width:0;min-height:44px;width:100%}
.aibar{display:flex;gap:6px;align-items:center;margin-bottom:12px}
.aibar .seg button{flex-direction:row;gap:5px;font-size:.86rem;padding:6px 4px}
.aibar .seg svg{width:1.05em;height:1.05em}
@media (max-width:420px){.aibar .seg svg{display:none}.aibar .seg button{font-size:.8rem}}
.card.slim{padding:10px 14px}
.ailog{min-height:calc(100dvh - 330px);padding:4px 2px 12px}
.msg{margin:14px 0;display:flex;gap:10px;align-items:flex-start}
.msg.usr{justify-content:flex-end}
.msg.usr .mb{background:var(--acs);border-radius:20px;padding:9px 15px;max-width:85%;white-space:pre-wrap;word-break:break-word}
.msg.bot .mav{width:30px;height:30px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;background:var(--acs);color:var(--ac)}
.msg.bot .mav svg{width:100%;height:100%}
.msg.bot .mav.orbi{background:radial-gradient(circle at 35% 30%,var(--o1),var(--o2) 55%,var(--o3))}
.msg.bot .mc{flex:1;min-width:0}
.mtx{word-break:break-word;line-height:1.75}
.mtx p{margin:0 0 .6em}.mtx p:last-child{margin:0}
.mtx ul,.mtx ol{margin:.2em 0 .7em;padding-inline-start:1.4em}
.mtx li{margin:.15em 0}
.mtx code{background:var(--card2);border:1px solid var(--bd);border-radius:6px;padding:0 5px;font-size:.88em;font-family:ui-monospace,Menlo,Consolas,monospace}
.mtx pre{background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;overflow:auto;direction:ltr;text-align:left}
.mtx pre code{border:0;padding:0;background:none}
.mtx .fixl{background:color-mix(in srgb,#d97706 12%,var(--card));border-inline-start:4px solid #d97706;border-radius:10px;padding:6px 10px;margin:.5em 0;font-size:.94em}
.mtx h4{margin:.6em 0 .3em;font-size:1rem}
.mtx a{word-break:break-all}
.msrc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.msrc a{font-size:.76rem;text-decoration:none;border:1px solid var(--bd);border-radius:99px;padding:3px 10px;color:var(--mu);max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--card)}
.macts{display:flex;gap:2px;margin-top:4px}
.macts button{width:34px;min-height:34px;padding:0;border:0;background:none;color:var(--mu)}
.macts button svg{width:1.05em;height:1.05em}
.mtr{color:var(--mu);font-size:.9rem;border-top:1px dashed var(--bd);margin-top:6px;padding-top:6px}
.merr{color:var(--bad)}
.typing{display:inline-flex;gap:5px;padding:8px 2px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--mu);animation:tdot 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.aiempty{text-align:center;padding:26px 8px 10px}
.aiempty .big{width:96px;height:96px;margin:0 auto 12px;border-radius:50%;overflow:hidden}
.aiempty .big.orbi{background:radial-gradient(circle at 35% 30%,var(--o1),var(--o2) 55%,var(--o3));box-shadow:0 12px 40px color-mix(in srgb,var(--o3) 35%,transparent);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05)}}
.aiempty h2{font-size:1.2rem;margin:0 0 4px}
.aiempty .chips{justify-content:center;margin-top:14px}
.aicomp{position:sticky;bottom:12px;z-index:4;display:flex;gap:6px;align-items:flex-end;background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:6px;box-shadow:0 6px 24px rgba(16,24,40,.12)}
.aicomp textarea{flex:1;min-height:44px;max-height:180px;border:0;background:none;resize:none;padding:10px 6px;line-height:1.5}
.aicomp textarea:focus-visible{outline:none}
button.round{border-radius:50%}
.aicomp button{flex:none}
@media (max-width:819px){.aicomp{bottom:calc(76px + env(safe-area-inset-bottom))}}
.hitem{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bd);padding:4px 0}
.hitem:last-child{border:0}
.hitem>button:first-child{flex:1;justify-content:flex-start;border:0;background:none;text-align:start;min-width:0;padding:8px 4px}
.hitem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.hitem small{display:block;color:var(--mu);font-size:.75rem}
.hitem.on>button:first-child{color:var(--ac);font-weight:600}
.hitem .x{width:38px;min-height:38px;padding:0;border:0;background:none;color:var(--mu)}

.macts .via{font-size:.7rem;color:var(--mu);opacity:.75;align-self:center;margin-inline-start:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.keysbn{background:var(--acs);border-radius:16px;padding:12px 14px;margin:12px auto 0;max-width:460px;font-size:.9rem;display:grid;gap:10px;justify-items:center}
/* look editor */
.lookwrap{display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:start}
@media (max-width:480px){.lookwrap{grid-template-columns:1fr}.lookprev{margin:auto}}
.lookprev{width:130px;height:130px;border-radius:50%;overflow:hidden;position:relative}
.lookprev svg{width:100%;height:100%}
.lookprev.orbi{background:radial-gradient(circle at 35% 30%,var(--o1),var(--o2) 55%,var(--o3));animation:breathe 4s ease-in-out infinite}
.lrow{margin-bottom:10px}
.lrow>b{display:block;font-size:.8rem;color:var(--mu);font-weight:600;margin-bottom:4px}
.lopts{display:flex;flex-wrap:wrap;gap:6px}
.lopts .sw{width:32px;height:32px;min-height:32px;border:2px solid var(--bd)}
.lopts .chip{min-height:34px;padding:4px 11px;font-size:.82rem}
.lopts .chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.lopts .orbsw{width:38px;height:38px;min-height:38px;border-radius:50%;padding:0;border:3px solid var(--card)}

/* voice mode */
#vm{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 18px);overflow:hidden}
#vm[hidden]{display:none!important}
.vmtop{display:flex;gap:8px;align-items:center;width:100%;max-width:560px}
.vmname{font-weight:700;font-size:1.05rem}
.vmstage{flex:1;display:grid;place-items:center;width:100%;max-width:560px;cursor:pointer;min-height:240px;outline:none;-webkit-tap-highlight-color:transparent}
.vmstage>*{grid-area:1/1}
#vmOrb{width:min(300px,72vw);height:min(300px,72vw)}
.vmav{width:min(270px,66vw);height:min(270px,66vw);border-radius:50%;overflow:hidden;position:relative;box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 40%,transparent);transition:box-shadow .15s}
.vmav svg{width:100%;height:100%;display:block}
#vm[data-st=listening] .vmav{box-shadow:0 0 0 calc(6px + var(--lv,0) * 18px) color-mix(in srgb,var(--ac) 30%,transparent)}
#vm[data-st=speaking] .vmav{box-shadow:0 0 0 calc(4px + var(--lv,0) * 10px) color-mix(in srgb,var(--ok) 28%,transparent)}
#vm[data-st=thinking] .vmav{animation:thinkring 1.4s ease-in-out infinite}
@keyframes thinkring{0%,100%{box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 15%,transparent)}50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--ac) 30%,transparent)}}
.vmstatus{color:var(--mu);font-weight:600;min-height:1.6em;margin:6px 0}
.vmcap{width:100%;max-width:560px;min-height:84px;max-height:30vh;overflow:auto;text-align:center;margin-bottom:12px}
.vmcap #vmYou{color:var(--mu);font-size:.95rem;margin-bottom:6px}
.vmcap #vmBot{font-size:1.12rem;font-weight:600}
#vm.nocap .vmcap{visibility:hidden}
.vmbar{display:flex;gap:22px;align-items:center;justify-content:center}
.vround{width:64px;height:64px;min-height:64px;border-radius:50%;padding:0;background:var(--card);border:1px solid var(--bd)}
.vround svg{width:26px;height:26px}
.vround.sm{width:44px;height:44px;min-height:44px}
.vround.sm svg{width:21px;height:21px}
.vround.end{background:var(--bad);border-color:var(--bad);color:#fff}
.vround.lang{font-weight:700;font-size:.95rem}
.vround.off{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.vround.on{color:var(--ac);border-color:var(--ac)}
.vmpanel{position:absolute;inset-inline:0;bottom:0;max-height:72vh;overflow:auto;background:var(--card);border-top:1px solid var(--bd);border-radius:22px 22px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 18px);box-shadow:0 -10px 40px rgba(0,0,0,.2);z-index:2}
.vmpanel .lookprev{display:none}
.vmpanel .lookwrap{grid-template-columns:1fr}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const hx=h=>{h=h.replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};
const toHex=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,p)=>{const x=hx(a),y=hx(b);return toHex(x.map((v,i)=>v+(y[i]-v)*p))};
const lum=h=>{const c=hx(h).map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*c[0]+.7152*c[1]+.0722*c[2]};

/* ================= CRYPTO + ACCOUNTS ================= */
const S=globalThis.crypto&&crypto.subtle,enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>{let s='';const a=new Uint8Array(u);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64=s=>{s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const ITER=310000;
const ADMIN_PUB={"kty":"EC","crv":"P-256","x":"tiBm6pI4vPooNzYswnrmnm-hM5OLJAqeQ2lbXMhAjM8","y":"ebpMTuqlw74eUPYE_Jv2vTcU_RjRBFY_920hOhMVe38"};
async function pwKey(pw,salt,iter){const k=await S.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return S.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(key,bytes){const iv=rnd(12);return{iv:b64(iv),ct:b64(await S.encrypt({name:'AES-GCM',iv},key,bytes))}}
async function unseal(key,box){return new Uint8Array(await S.decrypt({name:'AES-GCM',iv:unb64(box.iv)},key,unb64(box.ct)))}
const aesKey=raw=>S.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
async function hkdf(bits,u){const k=await S.importKey('raw',bits,'HKDF',false,['deriveBits']);return new Uint8Array(await S.deriveBits({name:'HKDF',hash:'SHA-256',salt:enc.encode('MA-reset:'+u),info:enc.encode('meeting-assistant-reset-v1')},k,256))}
async function adminWrap(u,raw){
 const eph=await S.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveBits']);
 const pub=await S.importKey('jwk',ADMIN_PUB,{name:'ECDH',namedCurve:'P-256'},false,[]);
 const k=await hkdf(await S.deriveBits({name:'ECDH',public:pub},eph.privateKey,256),u);
 return{eph:b64(await S.exportKey('raw',eph.publicKey)),box:await seal(await aesKey(k),raw)};
}

async function createAccount(name,pw,vg){
 if(!S)throw'eCrypto';
 name=name.trim();const u=uid(name);if(!/^[\p{L}\p{N}._@-]{2,32}$/u.test(u))throw'eUname';if(USERS[u])throw'eExists';
 const raw=rnd(32),salt=rnd(16);
 const rec={name,salt:b64(salt),iter:ITER,pw:await seal(await pwKey(pw,salt,ITER),raw),created:Date.now(),fails:0,until:0};
 const a=await adminWrap(u,raw);rec.eph=a.eph;rec.adm=a.box;rec.kid=ADMIN_PUB.x;
 V=freshVault();V.set.vg=vg||'female';
 let mig=false;
 if(!Object.keys(USERS).length){try{const op=localStorage.getItem('prof'),om=localStorage.getItem('mtgs');if(op){Object.assign(V.prof,JSON.parse(op));mig=true}if(om){V.meetings=JSON.parse(om)||[];mig=true}}catch(e){}}
 USERS[u]=rec;DKraw=raw;DK=await aesKey(raw);U=u;await saveVault(true);
 if(mig){localStorage.removeItem('prof');localStorage.removeItem('mtgs');setTimeout(()=>toast(t('migrated')),800)}
}
async function login(name,pw){
 if(!S)throw'eCrypto';
 const u=uid(name),rec=USERS[u];if(!rec)throw'eNouser';
 if(rec.until>Date.now())throw{k:'eWait',s:Math.ceil((rec.until-Date.now())/1000)};
 let raw;try{raw=await unseal(await pwKey(pw,unb64(rec.salt),rec.iter),rec.pw)}catch(e){rec.fails=(rec.fails||0)+1;if(rec.fails>=5)rec.until=Date.now()+Math.min(300000,30000*2**(rec.fails-5));saveUsers();throw'eBad'}
 rec.fails=0;rec.until=0;DKraw=raw;DK=await aesKey(raw);U=u;
 /* accounts wrapped for another reset key are moved to the current one at sign-in, so the reset tool keeps working */
 if(rec.kid!==ADMIN_PUB.x){try{const a=await adminWrap(u,raw);rec.eph=a.eph;rec.adm=a.box;rec.kid=ADMIN_PUB.x}catch(e){}}
 const d=JSON.parse(dec.decode(await unseal(DK,rec.vault)));
 V=Object.assign(freshVault(),d);V.prof=Object.assign(freshProf(),d.prof);V.set=Object.assign(freshSet(),d.set);V.set.vpin=V.set.vpin||{};V.tasks=d.tasks||[];V.chats=d.chats||[];V.set.ai=Object.assign(freshAi(),(d.set||{}).ai||{});V.set.ai.av=Object.assign(freshAv(),V.set.ai.av||{});
 saveUsers();
}

 if(now)return go();saveVault.h=setTimeout(go,500);
}

function resetRequest(name){const u=uid(name),rec=USERS[u];if(!rec)throw'eNouser';return'MA1.'+b64(enc.encode(u))+'.'+rec.eph}
async function doReset(name,key,pw){
 const u=uid(name),rec=USERS[u];if(!rec)throw'eNouser';
 if(/^\s*MA1\./i.test(key))throw'eIsReq';const k=key.replace(/[^A-Za-z0-9_-]/g,'');let raw;
 try{const kb=unb64(k);if(kb.length!==32)throw 0;raw=await unseal(await aesKey(kb),rec.adm)}catch(e){throw'eKey'}
 const salt=rnd(16);rec.salt=b64(salt);rec.iter=ITER;rec.pw=await seal(await pwKey(pw,salt,ITER),raw);
 const a=await adminWrap(u,raw);rec.eph=a.eph;rec.adm=a.box;rec.kid=ADMIN_PUB.x;rec.fails=0;rec.until=0;saveUsers();
}

 const salt=rnd(16);rec.salt=b64(salt);rec.iter=ITER;rec.pw=await seal(await pwKey(pw,salt,ITER),DKraw);saveUsers();
}

/* ---------- password reset by email (Google Apps Script service, see reset-service.gs) ---------- */
const RESET_API_DEFAULT='https://script.google.com/macros/s/AKfycbwJCwjSMYVWGaiJn0ThpmIDFImY-64os7qjmwHbFok-GZbLzF1ggjk9E39u1zulTqAS2Q/exec';
/* links of deleted Apps Script projects: a device that saved one goes back to the default */
try{if(['AKfycbwIgTYRW5bFTBfTuMBCJYUVuEGazuqCh-K7ML0jFsrfSgRA7lj1DeiSF7yo4qB2o1wP'].some(x=>(localStorage.getItem('ma_reset_api')||'').includes(x)))localStorage.removeItem('ma_reset_api')}catch(e){}/* optional: paste the Apps Script web-app URL here so every device uses it */
const resetApi=()=>(localStorage.getItem('ma_reset_api')||RESET_API_DEFAULT).trim();
async function rApi(q,ms=20000){const url=resetApi();if(!url)throw'eNoSvc';if(!navigator.onLine)throw'offline';
 let r;try{r=await withTimeout(fetch(url+(url.includes('?')?'&':'?')+new URLSearchParams(q),{redirect:'follow'}),ms,'eSvc')}catch(e){throw e==='eSvc'?{k:'eSvc',d:'timeout'}:{k:'eSvcAccess',d:String(e&&e.message||e)}}
 if(!r.ok)throw{k:'eSvc',d:'HTTP '+r.status};
 let j,tx='';try{tx=await r.text();j=JSON.parse(tx)}catch(e){throw{k:'eSvcAccess',d:'not JSON: '+tx.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,90)}}return j}
/* registers this account with the email service: the data key is sealed with a key only the service can re-derive */
async function enrollMail(u,raw){const j=await rApi({a:'enroll'});if(!j.ok||!j.id||!j.k)throw{k:'eSvc',d:'enroll: '+(j.e||JSON.stringify(j).slice(0,80))};let k;try{k=unb64(j.k)}catch(e){k=[]}if(k.length!==32)throw{k:'eSvc',d:'enroll key '+k.length};
 const rec=USERS[u];rec.mid=j.id;rec.mbox=await seal(await aesKey(k),raw);rec.mapi=resetApi();saveUsers();return true}
async function ensureMail(){if(!U||!DKraw||!resetApi())return false;const rec=USERS[U];if(rec.mid&&rec.mapi===resetApi())return true;try{return await enrollMail(U,DKraw)}catch(e){return false}}
const mailReady=rec=>!!(rec&&rec.mid&&rec.mbox&&resetApi());
/* v2: reset through the admin escrow every account already has, so it works on any device with no enrollment */
const admReady=rec=>!!(rec&&rec.eph&&rec.adm&&rec.kid===ADMIN_PUB.x&&resetApi());
const hexId=()=>Array.from(rnd(16),x=>x.toString(16).padStart(2,'0')).join('');
let RST=null;/* {u,n,id,raw,poll,until} */
try{const s=JSON.parse(sessionStorage.getItem('ma_rst')||'null');if(s&&s.until>Date.now())RST=s}catch(e){}

async function fgSend(){const name=$('gUser').value.trim(),u=uid(name),rec=USERS[u];$('aErr').textContent='';
 if(!rec)return aErr('eNouser');
 const adm=admReady(rec);
 if(!adm&&!mailReady(rec)){fgAltShow(name);return}
 const b=$('gSend'),old=b.textContent;b.disabled=true;b.textContent=t('checking');
 try{const n=b64(rnd(24)),id=adm?hexId():rec.mid,q={a:'send',id,u:rec.name,n};if(adm){q.k=u;q.e=rec.eph}
  const j=await rApi(q);
  if(!j.ok)throw j.e==='wait'?'eSvcWait':j.e==='limit'?'eSvcLimit':{k:'eSvc',d:'send: '+(j.e||'')};
  if(adm&&j.v!==2)throw'eSvcOld';
  fgStop();RST={u,n,id,m:adm?'adm':'mid',until:Date.now()+15*60000};sessionStorage.setItem('ma_rst',JSON.stringify(RST));fgWait()}
 catch(x){aErr(x)}finally{b.disabled=false;b.textContent=old}}
function fgWait(){fgShow('fgWait');$('gUser').value=(USERS[RST.u]||{}).name||RST.u;$('gWaitTx').textContent=t('fgWaitTx');fgStop();
 const tick=async()=>{if(!RST)return;const left=RST.until-Date.now();if(left<=0){fgStop();sessionStorage.removeItem('ma_rst');RST=null;fgShow('fg1');aErr('eLinkOld');return}
  $('gTimer').textContent=Math.floor(left/60000)+':'+String(Math.floor(left/1000)%60).padStart(2,'0');
  if(tick.busy||document.visibilityState!=='visible')return;tick.busy=true;
  try{const j=await rApi({a:'status',id:RST.id,n:RST.n},12000);
   if(j.ok&&j.k){const rec=USERS[RST.u];fgStop();sessionStorage.removeItem('ma_rst');
    try{RST.raw=await unseal(await aesKey(unb64(j.k)),RST.m==='adm'?rec.adm:rec.mbox)}catch(e){const old=RST.m==='adm'&&j.m!=='adm';RST=null;fgShow('fg1');aErr(old?'eSvcOld':'eKey');return}
    fgShow('fgNew');$('gPass').focus()}
   else if(j.e==='expired'||j.e==='bad'){fgStop();sessionStorage.removeItem('ma_rst');RST=null;fgShow('fg1');aErr('eLinkOld')}}
  catch(e){}finally{tick.busy=false}};
 RST.poll=setInterval(tick,1000);fgWait.tick=tick;tick()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&RST&&RST.poll&&fgWait.tick)fgWait.tick()});

function extractive(txt,n=5){
 const s=(txt.replace(/\s+/g,' ').match(/[^.!?؟۔。]+[.!?؟۔。]?/g)||[txt]).map(x=>x.trim()).filter(Boolean);
 if(s.length<=n)return s.map(x=>'• '+x).join('\n');
 const w=x=>x.toLowerCase().match(/[\p{L}\p{N}]{3,}/gu)||[],f={};
 s.forEach(x=>w(x).forEach(k=>f[k]=(f[k]||0)+1));
 return s.map((x,i)=>({i,x,v:w(x).reduce((a,k)=>a+f[k],0)/Math.sqrt(w(x).length||1)})).sort((a,b)=>b.v-a.v).slice(0,n).sort((a,b)=>a.i-b.i).map(o=>'• '+o.x).join('\n');
}

let si=0,sent=SENT[0],coOn=false,coRec=null;
const norm=w=>w.toLowerCase().replace(/[^a-z0-9']/g,'');
function renderTarget(items){const el=$('coTarget');el.innerHTML='';
 (items||sent.split(/\s+/).map(w=>({w,ok:null}))).forEach(i=>{const s=mk('span','w'+(i.ok===true?' ok':i.ok===false?' bad':''),i.w);
  if(i.ok===false&&i.h)s.append(mk('small',null,t('heard')+': '+i.h));
  s.onclick=()=>say(i.w.replace(/[^\w']/g,''),'en-US',.7);el.append(s)})}
function align(a,b){const n=a.length,m=b.length,d=Array.from({length:n+1},()=>Array(m+1).fill(0));
 for(let i=0;i<=n;i++)d[i][0]=i;for(let j=0;j<=m;j++)d[0][j]=j;
 for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
 let i=n,j=m;const out=[];
 while(i>0||j>0){if(i>0&&j>0&&d[i][j]===d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)){out.push({ok:a[i-1]===b[j-1],h:a[i-1]===b[j-1]?'':b[j-1]});i--;j--}else if(i>0&&d[i][j]===d[i-1][j]+1){out.push({ok:false,h:''});i--}else j--}
 return out.reverse()}
function setSent(x){sent=x.trim();$('coRes').innerHTML='';renderTarget()}
function grade(text,conf){
 const orig=sent.split(/\s+/),al=align(orig.map(norm),text.split(/\s+/).map(norm).filter(Boolean));
 const items=orig.map((w,i)=>({w,ok:al[i].ok,h:al[i].h}));renderTarget(items);
 const ok=items.filter(i=>i.ok).length,acc=Math.round(100*ok/orig.length),cl=Math.round((conf||0)*100);
 const el=$('coRes');el.innerHTML='';const st=mk('div','stats');
 [[acc,'acc'],...(cl?[[cl,'clar']]:[])].forEach(([v,k])=>{const s=mk('div','stat');s.append(mk('b',null,v+'%'),t(k));st.append(s)});
 el.append(st,mk('div',null,acc===100?t('perfect'):t('fix')));
 const bad=items.filter(i=>!i.ok).map(i=>i.w.replace(/[^\w']/g,'')).filter(Boolean);
 setTimeout(()=>say(acc===100?'Excellent!':(acc>=70?'Good. Practice: ':'Try again. Practice: ')+bad.slice(0,4).join(', '),'en-US',.9),300);
}

  if(ci>0){bump(P.c,lines[ci].replace(/[,.،]+$/,''));const sg=lines.slice(ci+1,ci+4).filter(l=>l.length<60);if(sg.length)bump(P.s,sg.join('\n'))}

 }

  const pre=g&&g!=='تحية طيبة'?(g+(nm?' '+nm:'')+'،\n\n'):formal?(nm?`الأستاذ/ ${nm} المحترم،\nتحية طيبة وبعد،\n\n`:'السادة المحترمون،\nتحية طيبة وبعد،\n\n'):(nm?`مرحبًا ${nm}،\n\n`:'مرحبًا،\n\n');

  keep:()=>VM.on&&VM.tok===tok&&VM.st==='listening'&&!VM.buf&&!VM.pend,

  end:()=>{if(VM.tok!==tok)return;VM.rec=null;if(!VM.on||VM.st!=='listening')return;

/* ---------- markdown-lite ---------- */
function mdHtml(x){
 const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const inl=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/__([^_]+)__/g,'<b>$1</b>').replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?؟،]|$)/g,'$1<i>$2</i>')
  .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/(^|\s)(https?:\/\/[^\s<]+[^\s<.,!?؟،)])/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
 const out=[];let list=null,code=null,para=[];
 const flushP=()=>{if(para.length){out.push('<p>'+para.map(inl).join('<br>')+'</p>');para=[]}};
 const flushL=()=>{if(list){out.push('<'+list.t+'>'+list.i.map(x=>'<li>'+inl(x)+'</li>').join('')+'</'+list.t+'>');list=null}};
 for(const ln of String(x).replace(/\r/g,'').split('\n')){
  if(code){if(/^\s*```/.test(ln)){out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');code=null}else code.push(ln);continue}
  if(/^\s*```/.test(ln)){flushP();flushL();code=[];continue}
  let m;
  if(!ln.trim()){flushP();flushL();continue}
  if((m=ln.match(/^\s*#{1,6}\s+(.*)/))){flushP();flushL();out.push('<h4>'+inl(m[1])+'</h4>');continue}
  if(/^\s*✏️/.test(ln)){flushP();flushL();out.push('<div class="fixl">'+inl(ln.trim())+'</div>');continue}
  if((m=ln.match(/^\s*[-*•]\s+(.*)/))){flushP();if(!list||list.t!=='ul'){flushL();list={t:'ul',i:[]}}list.i.push(m[1]);continue}
  if((m=ln.match(/^\s*\d+[.)]\s+(.*)/))){flushP();if(!list||list.t!=='ol'){flushL();list={t:'ol',i:[]}}list.i.push(m[1]);continue}
  flushL();para.push(ln.trim());
 }
 if(code)out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');flushP();flushL();return out.join('');
}
const plainText=x=>String(x||'').replace(/```[\s\S]*?```/g,' ').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/https?:\/\/\S+/g,'').replace(/[*_#`>|]/g,'').replace(/\[\d+\]/g,'').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,'').replace(/\s+/g,' ').trim();
